<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PA2 - Surface of Conjugation of Two Coaxial Cylinders</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #c9d1d9;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
        }
        h1 {
            color: #58a6ff;
            font-weight: 400;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .main-area {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        #canvas-holder {
            background: #010409;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #30363d;
        }
        #webglcanvas {
            display: block;
            border-radius: 4px;
        }
        .controls {
            background: #161b22;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #30363d;
            min-width: 200px;
        }
        .controls h3 {
            margin: 0 0 15px 0;
            color: #58a6ff;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .control-group .val {
            color: #58a6ff;
            font-weight: 500;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #30363d;
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #58a6ff;
            border-radius: 50%;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #58a6ff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        .info-box {
            margin-top: 20px;
            padding: 12px;
            background: #21262d;
            border-radius: 6px;
            font-size: 12px;
            color: #8b949e;
        }
        .info-box p {
            margin: 4px 0;
        }
    </style>
    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./Model.js"></script>
    <script src="./main.js"></script>
</head>
<body onload="init()">
    <div class="container">
        <h1>Surface of Conjugation of Two Coaxial Cylinders</h1>

        <div class="main-area">
            <div id="canvas-holder">
                <canvas width="600" height="600" id="webglcanvas"></canvas>
            </div>

            <div class="controls">
                <h3>Surface Granularity</h3>

                <div class="control-group">
                    <label>
                        <span>U Segments (height)</span>
                        <span class="val" id="val_u">20</span>
                    </label>
                    <input type="range" min="4" max="50" value="20"
                           oninput="on_slider_u(this.value)">
                </div>

                <div class="control-group">
                    <label>
                        <span>V Segments (angle)</span>
                        <span class="val" id="val_v">36</span>
                    </label>
                    <input type="range" min="8" max="72" value="36"
                           oninput="on_slider_v(this.value)">
                </div>

                <div class="info-box">
                    <p><strong>Shading:</strong> Gouraud (per-vertex)</p>
                    <p><strong>Normals:</strong> Facet Average</p>
                    <p><strong>Lighting:</strong> Phong model</p>
                    <p><strong>Light:</strong> Rotating around surface</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
